<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blackjack Basic Strategy — HAL</title>
<link href="https://fonts.googleapis.com/css2?family=Gill+Sans+Nova:wght@200;300;400;600&display=swap" rel="stylesheet">
<style>
  /*
    2001: A Space Odyssey
    Deep blacks, bone whites, HAL red, Discovery orange
    Gill Sans Light — clean, institutional, slightly cold
  */
  :root {
    --black:    #080808;
    --panel:    #111210;
    --border:   #888880;
    --bone:     #e8e4d8;
    --dim:      #eceae4;
    --hal:      #e8450a;      /* HAL red-orange */
    --orange:   #d4621a;      /* pod bay orange */
    --amber:    #c8960a;      /* instrument amber */
    --blue:     #3a6ea8;      /* Discovery blue */
    --correct:  #4a9a6a;
    --wrong:    #c84040;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--black);
    background-image:
      radial-gradient(ellipse at 50% 0%, #1a1208 0%, transparent 55%),
      radial-gradient(ellipse at 80% 100%, #0a1020 0%, transparent 50%);
    min-height: 100vh;
    font-family: 'Gill Sans Nova', 'Gill Sans', 'GillSans-Light', Optima, sans-serif;
    font-weight: 300;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 44px;
  }

  header { text-align: center; margin-bottom: 20px; }
  header h1 {
    font-size: clamp(1.6rem, 5vw, 2.4rem);
    font-weight: 200;
    color: var(--bone);
    letter-spacing: 8px;
    text-transform: uppercase;
    line-height: 1;
  }
  header p {
    color: var(--dim);
    font-size: 0.62rem;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-top: 6px;
    font-weight: 300;
  }

  .score-row {
    display: flex;
    gap: 24px;
    margin-bottom: 12px;
    font-size: 0.85rem;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .score-item { color: var(--dim); }
  .score-item.correct span { color: var(--correct); }
  .score-item.wrong span { color: var(--wrong); }

  .progress-bar-wrap {
    width: min(420px, 100%);
    background: var(--border);
    border-radius: 0;
    height: 1px;
    margin-bottom: 6px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--hal);
    border-radius: 0;
    transition: width 0.4s ease;
    box-shadow: 0 0 6px var(--hal);
  }
  .counter {
    font-size: 0.6rem;
    color: var(--dim);
    text-align: center;
    margin-bottom: 18px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .category-tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 18px;
    width: min(500px, 100%);
  }
  .tab {
    font-family: 'Gill Sans Nova', 'Gill Sans', Optima, sans-serif;
    font-weight: 300;
    font-size: 0.58rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 6px 12px;
    border-radius: 0;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--dim);
    cursor: pointer;
    transition: all 0.2s;
  }
  .tab.active {
    background: transparent;
    color: var(--hal);
    border-color: var(--hal);
    box-shadow: 0 0 8px rgba(232,69,10,0.25);
  }
  .tab:hover:not(.active) { border-color: var(--dim); color: var(--bone); }

  /* CARD */
  .card-scene {
    width: min(420px, 100%);
    height: 260px;
    perspective: 1200px;
    margin-bottom: 20px;
    cursor: default;
  }
  .card-inner {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .card-inner.flipped { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 2px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px 26px;
  }
  .card-front {
    background: var(--panel);
    border: 1px solid var(--border);
    box-shadow:
      0 0 0 1px #1a1a18,
      0 30px 60px rgba(0,0,0,0.7),
      inset 0 1px 0 rgba(255,255,255,0.03);
  }
  .card-back {
    background: var(--panel);
    border: 1px solid var(--orange);
    transform: rotateY(180deg);
    box-shadow:
      0 0 20px rgba(212,98,26,0.15),
      0 30px 60px rgba(0,0,0,0.7);
  }
  .card-back.result-correct {
    border-color: var(--correct);
    box-shadow: 0 0 20px rgba(74,154,106,0.2), 0 30px 60px rgba(0,0,0,0.7);
  }
  .card-back.result-wrong {
    border-color: var(--wrong);
    box-shadow: 0 0 20px rgba(200,64,64,0.2), 0 30px 60px rgba(0,0,0,0.7);
  }

  .card-suit-corner {
    position: absolute; top: 14px; left: 16px;
    font-size: 0.8rem; color: var(--border); opacity: 1;
  }
  .card-suit-corner.br {
    top: auto; left: auto; bottom: 14px; right: 16px;
    transform: rotate(180deg);
  }

  .card-label {
    font-size: 0.52rem;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--orange);
    margin-bottom: 12px;
    font-weight: 300;
    opacity: 0.8;
  }
  .card-question {
    font-size: clamp(1.2rem, 4vw, 1.65rem);
    font-weight: 200;
    color: var(--bone);
    text-align: center;
    letter-spacing: 2px;
    line-height: 1.35;
    text-transform: uppercase;
  }

  /* back face */
  .result-verdict {
    font-size: 0.6rem;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 8px;
    font-weight: 400;
  }
  .result-verdict.correct { color: var(--correct); }
  .result-verdict.wrong   { color: var(--wrong); }

  .action-badge {
    font-size: clamp(1.8rem, 6vw, 2.6rem);
    font-weight: 200;
    letter-spacing: 6px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .action-badge.hit      { color: var(--amber); }
  .action-badge.stand    { color: var(--correct); }
  .action-badge.double   { color: var(--blue); }
  .action-badge.split    { color: var(--orange); }
  .action-badge.surrender{ color: var(--dim); }

  .your-answer {
    font-size: 0.58rem;
    color: var(--dim);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 8px;
    opacity: 0.7;
  }
  .card-answer-detail {
    font-size: 0.68rem;
    font-weight: 300;
    color: rgba(236,234,228,0.9);
    text-align: center;
    line-height: 1.7;
    max-width: 300px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .card-answer-detail strong { color: var(--bone); font-weight: 400; }

  /* ACTION BUTTONS */
  .action-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    width: min(420px, 100%);
    margin-bottom: 12px;
  }
  .action-btn {
    font-family: 'Gill Sans Nova', 'Gill Sans', Optima, sans-serif;
    font-weight: 300;
    font-size: 0.78rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    border: 1px solid var(--border);
    border-radius: 0;
    padding: 15px 10px;
    cursor: pointer;
    background: var(--panel);
    color: var(--dim);
    transition: all 0.15s;
  }
  .action-btn.hit:hover:not(:disabled)      { border-color: var(--amber);   color: var(--amber);   box-shadow: inset 0 0 20px rgba(200,150,10,0.08); }
  .action-btn.stand:hover:not(:disabled)    { border-color: var(--correct); color: var(--correct); box-shadow: inset 0 0 20px rgba(74,154,106,0.08); }
  .action-btn.double:hover:not(:disabled)   { border-color: var(--blue);    color: var(--blue);    box-shadow: inset 0 0 20px rgba(58,110,168,0.08); }
  .action-btn.surrender:hover:not(:disabled){ border-color: var(--dim);     color: var(--bone);    box-shadow: inset 0 0 20px rgba(122,120,112,0.08); }
  .action-btn.split:hover:not(:disabled)    { border-color: var(--orange);  color: var(--orange);  box-shadow: inset 0 0 20px rgba(212,98,26,0.08); }
  .action-btn:active { transform: scale(0.98); }
  .action-btn:disabled { opacity: 0.2; cursor: default; transform: none; }

  .action-btn.flash-correct { animation: flashG 0.5s ease; }
  .action-btn.flash-wrong   { animation: flashR 0.5s ease; }
  @keyframes flashG { 0%{ border-color:var(--correct); color:var(--correct); } 100%{} }
  @keyframes flashR { 0%{ border-color:var(--wrong);   color:var(--wrong);   } 100%{} }

  .btn-shuffle {
    background: transparent;
    color: var(--border);
    border: 1px solid var(--border);
    font-size: 0.56rem;
    padding: 8px 16px;
    border-radius: 0;
    cursor: pointer;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-family: 'Gill Sans Nova', 'Gill Sans', Optima, sans-serif;
    font-weight: 300;
    transition: all 0.2s;
    display: block;
    margin: 0 auto;
  }
  .btn-shuffle:hover { color: var(--dim); border-color: var(--dim); }

  /* END SCREEN */
  .end-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 18px;
    width: min(420px, 100%);
  }
  .end-screen.visible { display: flex; }
  .end-title {
    font-size: clamp(1.4rem, 5vw, 2rem);
    font-weight: 200;
    color: var(--bone);
    letter-spacing: 8px;
    text-transform: uppercase;
  }
  .end-score {
    font-size: 0.65rem;
    color: var(--dim);
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .end-score span { color: var(--hal); font-size: 1.6rem; font-weight: 200; letter-spacing: 4px; }
  .btn-restart {
    font-family: 'Gill Sans Nova', 'Gill Sans', Optima, sans-serif;
    font-weight: 300;
    font-size: 0.72rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    background: transparent;
    color: var(--hal);
    border: 1px solid var(--hal);
    border-radius: 0;
    padding: 14px 40px;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 0 12px rgba(232,69,10,0.2);
  }
  .btn-restart:hover { background: rgba(232,69,10,0.08); box-shadow: 0 0 20px rgba(232,69,10,0.35); }

  .action-btn.surrender { grid-column: span 1; }
  .action-btn.split { background: var(--panel); color: var(--dim); border: 1px solid var(--border); }
  #actionButtons { grid-template-columns: 1fr 1fr; }
</style>
</head>


<header>
  <h1>Basic Strategy</h1>
  <p>MIT Blackjack · Flash Cards</p>
</header>

<div class="category-tabs" id="tabs"></div>

<div class="score-row">
  <div class="score-item correct">✓ <span id="scoreCorrect">0</span></div>
  <div class="score-item wrong">✗ <span id="scoreWrong">0</span></div>
</div>

<div class="progress-bar-wrap">
  <div class="progress-bar-fill" id="progressFill"></div>
</div>
<div class="counter" id="counter"></div>

<!-- CARD -->
<div class="card-scene" id="cardScene" onclick="cardTapped()">
  <div class="card-inner" id="cardInner">
    <div class="card-face card-front">
      <span class="card-suit-corner">♠</span>
      <span class="card-suit-corner br">♠</span>
      <div class="card-label">The Rule</div>
      <div class="card-question" id="questionText"></div>
    </div>
    <div class="card-face card-back" id="backFace">
      <div class="result-verdict" id="resultVerdict"></div>
      <div class="your-answer" id="yourAnswerLabel"></div>
      <div class="action-badge" id="actionBadge"></div>
      <div class="card-answer-detail" id="answerDetail"></div>
      <div class="tap-hint" id="tapHint" style="display:none;margin-top:14px;font-family:'DM Mono',monospace;font-size:0.62rem;letter-spacing:2px;color:rgba(255,255,255,0.3);text-transform:uppercase;">tap to continue</div>
    </div>
  </div>
</div>

<!-- ACTION BUTTONS -->
<div class="action-buttons" id="actionButtons">
  <button class="action-btn hit"       onclick="answer('HIT')">Hit</button>
  <button class="action-btn stand"     onclick="answer('STAND')">Stand</button>
  <button class="action-btn double"    onclick="answer('DOUBLE')">Double</button>
  <button class="action-btn surrender" onclick="answer('SURRENDER')">Surrender</button>
</div>


<button class="btn-shuffle" onclick="shuffle()">⟳ Shuffle Deck</button>

<!-- END SCREEN -->
<div class="end-screen" id="endScreen">
  <div class="end-title">Deck Complete</div>
  <div class="end-score">Score: <span id="finalScore"></span></div>
  <button class="btn-restart" onclick="shuffle()">Play Again</button>
</div>

  { cat:"Soft Totals", q:"Soft 18\nvs. Dealer showing 20",  action:"HIT",    cls:"hit",    detail:"<strong>Hit</strong> soft 18 against dealer 19–20 or soft 21.<br>This is the trickiest rule — don't stand here!" },
  { cat:"Soft Totals", q:"Soft 19\nvs. Dealer showing 20",  action:"STAND",  cls:"stand",  detail:"Always <strong>stand</strong> on soft 19 or 20 — these are strong hands." },
  { cat:"Soft Totals", q:"Soft 20\nvs. Dealer showing 21",  action:"STAND",  cls:"stand",  detail:"Always <strong>stand</strong> on soft 19 or 20 — these are strong hands." },

  { cat:"Pairs", q:"Hard 4 (two equal low cards)\nvs. Dealer showing 12", action:"SPLIT",  cls:"split",  detail:"<strong>Split</strong> hard 4 against dealer hard 12–17.<br>Hit against dealer 18 or higher." },
  { cat:"Pairs", q:"Hard 4 (two equal low cards)\nvs. Dealer showing 17", action:"SPLIT",  cls:"split",  detail:"<strong>Split</strong> hard 4 against dealer hard 12–17.<br>Hit against dealer 18 or higher." },
  { cat:"Pairs", q:"Hard 4 (two equal low cards)\nvs. Dealer showing 18", action:"HIT",    cls:"hit",    detail:"<strong>Hit</strong> hard 4 against dealer 18 or higher.<br>Only split against dealer 12–17." },
  { cat:"Pairs", q:"Hard 6 (two equal low cards)\nvs. Dealer showing 13", action:"SPLIT",  cls:"split",  detail:"<strong>Split</strong> hard 6 against dealer hard 12–17.<br>Hit against dealer 18 or higher." },
  { cat:"Pairs", q:"Hard 6 (two equal low cards)\nvs. Dealer showing 19", action:"HIT",    cls:"hit",    detail:"<strong>Hit</strong> hard 6 against dealer 18 or higher.<br>Only split against dealer 12–17." },
  { cat:"Pairs", q:"Hard 8 (two equal cards)\nvs. Dealer showing 15",     action:"SPLIT",  cls:"split",  detail:"<strong>Split</strong> hard 8 against dealer soft 15–16 only.<br>Hit against all other dealer totals." },
  { cat:"Pairs", q:"Hard 8 (two equal cards)\nvs. Dealer showing 16",     action:"SPLIT",  cls:"split",  detail:"<strong>Split</strong> hard 8 against dealer soft 15–16 only.<br>Hit against all other dealer totals." },
  { cat:"Pairs", q:"Hard 8 (two equal cards)\nvs. Dealer showing 17",     action:"HIT",    cls:"hit",    detail:"<strong>Hit</strong> hard 8 against dealer 17 or higher.<br>Only split against dealer soft 15–16." },
  { cat:"Pairs", q:"Hard 10 (two equal cards)\nvs. Dealer showing 15",    action:"DOUBLE", cls:"double", detail:"<strong>Never split — treat as Hard 10.</strong><br>Double against dealer 12–19. Hit against dealer 20 or soft 21." },
  { cat:"Pairs", q:"Hard 10 (two equal cards)\nvs. Dealer showing 20",    action:"HIT",    cls:"hit",    detail:"<strong>Never split — treat as Hard 10.</strong><br>Hit against dealer hard 20 or soft 21." },
  { cat:"Pairs", q:"Hard 12 (two equal cards)\nvs. Dealer showing 12",    action:"SPLIT",  cls:"split",  detail:"<strong>Split</strong> hard 12 against dealer soft 12–16.<br>Hit against dealer hard 17 or higher." },
  { cat:"Pairs", q:"Hard 12 (two equal cards)\nvs. Dealer showing 16",    action:"SPLIT",  cls:"split",  detail:"<strong>Split</strong> hard 12 against dealer soft 12–16.<br>Hit against dealer hard 17 or higher." },
  { cat:"Pairs", q:"Hard 12 (two equal cards)\nvs. Dealer showing 17",    action:"HIT",    cls:"hit",    detail:"<strong>Hit</strong> hard 12 against dealer hard 17 or higher.<br>Only split against dealer soft 12–16." },
  { cat:"Pairs", q:"Hard 14 (two equal cards)\nvs. Dealer showing 13",    action:"SPLIT",  cls:"split",  detail:"<strong>Split</strong> hard 14 against dealer hard 12–17.<br>Hit against dealer 18 or higher." },
  { cat:"Pairs", q:"Hard 14 (two equal cards)\nvs. Dealer showing 17",    action:"SPLIT",  cls:"split",  detail:"<strong>Split</strong> hard 14 against dealer hard 12–17.<br>Hit against dealer 18 or higher." },
  { cat:"Pairs", q:"Hard 14 (two equal cards)\nvs. Dealer showing 18",    action:"HIT",    cls:"hit",    detail:"<strong>Hit</strong> hard 14 against dealer 18 or higher.<br>Only split against dealer 12–17." },
  { cat:"Pairs", q:"Hard 16 (two equal cards)\nvs. Dealer showing 14",    action:"SPLIT",  cls:"split",  detail:"<strong>Always split hard 16.</strong> It is the worst hand in blackjack.<br>Splitting gives you two chances to improve." },
  { cat:"Pairs", q:"Hard 16 (two equal cards)\nvs. Dealer showing 20",    action:"SPLIT",  cls:"split",  detail:"<strong>Always split hard 16</strong> — even against dealer 20.<br>Hard 16 is the worst hand. Always split." },
  { cat:"Pairs", q:"Hard 18 (two equal cards)\nvs. Dealer showing 13",    action:"SPLIT",  cls:"split",  detail:"<strong>Split</strong> hard 18 against dealer soft 12–16 and hard 18–19.<br>Stand against dealer hard 17, 20, or soft 21." },
  { cat:"Pairs", q:"Hard 18 (two equal cards)\nvs. Dealer showing 17",    action:"STAND",  cls:"stand",  detail:"<strong>Stand</strong> hard 18 against dealer hard 17.<br>Split against soft 12–16 and hard 18–19. Stand against 20 and soft 21 too." },
  { cat:"Pairs", q:"Hard 18 (two equal cards)\nvs. Dealer showing 19",    action:"SPLIT",  cls:"split",  detail:"<strong>Split</strong> hard 18 against dealer hard 18–19.<br>Stand against dealer hard 17, 20, or soft 21." },
  { cat:"Pairs", q:"Hard 18 (two equal cards)\nvs. Dealer showing 20",    action:"STAND",  cls:"stand",  detail:"<strong>Stand</strong> hard 18 against dealer hard 20 or soft 21.<br>Split against soft 12–16 and hard 18–19." },
  { cat:"Pairs", q:"Hard 20 (two equal cards)\nvs. Dealer showing 19",    action:"STAND",  cls:"stand",  detail:"<strong>Never split hard 20.</strong> Always stand.<br>Splitting 20 is one of the biggest mistakes at the table." },
  { cat:"Pairs", q:"Soft 12 (two Aces)\nvs. Dealer showing 15",           action:"SPLIT",  cls:"split",  detail:"<strong>Always split Aces</strong> — no exceptions, any dealer total.<br>You receive only one card on each Ace after splitting." },
  { cat:"Pairs", q:"Soft 12 (two Aces)\nvs. Dealer showing 20",           action:"SPLIT",  cls:"split",  detail:"<strong>Always split Aces</strong> — even against dealer 20.<br>You receive only one card on each Ace after splitting." },

  { cat:"Surrender", q:"Hard 16\nvs. Dealer showing 19",  action:"SURRENDER", cls:"surrender", detail:"<strong>Surrender</strong> hard 16 against dealer 19–21 if allowed.<br>Hit if surrender is unavailable.<br>Exception: if your 16 is two 8s, always split instead." },
  { cat:"Surrender", q:"Hard 16\nvs. Dealer showing 20",  action:"SURRENDER", cls:"surrender", detail:"<strong>Surrender</strong> hard 16 against dealer 19–21 if allowed.<br>Hit if surrender is unavailable.<br>Exception: if your 16 is two 8s, always split instead." },
  { cat:"Surrender", q:"Hard 16\nvs. Dealer showing 21",  action:"SURRENDER", cls:"surrender", detail:"<strong>Surrender</strong> hard 16 against dealer 19–21 if allowed.<br>Hit if surrender is unavailable." },
  { cat:"Surrender", q:"Hard 15\nvs. Dealer showing 20",  action:"SURRENDER", cls:"surrender", detail:"<strong>Surrender</strong> hard 15 against dealer hard 20.<br>Hit if surrender is not available." },
];

// Pair actions need SPLIT button — add it dynamically
const CATEGORIES = ["All", ...new Set(ALL_CARDS.map(c => c.cat))];

let currentCat = "All";
let deck = [];
let idx = 0;
let correctCount = 0;
let wrongCount = 0;
let answered = false;

function getFilteredDeck() {
  return currentCat === "All" ? [...ALL_CARDS] : ALL_CARDS.filter(c => c.cat === currentCat);
}

function shuffle() {
  deck = getFilteredDeck().sort(() => Math.random() - 0.5);
  idx = 0;
  correctCount = 0;
  wrongCount = 0;
  answered = false;
  document.getElementById('endScreen').classList.remove('visible');
  document.getElementById('cardScene').style.display = '';
  document.getElementById('actionButtons').style.display = '';
  document.getElementById('btnShuffle') && (document.getElementById('btnShuffle').style.display = '');
  document.getElementById('cardInner').classList.remove('flipped');
  document.getElementById('backFace').className = 'card-face card-back';
  document.getElementById('tapHint').style.display = 'none';
  updateScore();
  render();
  setButtonsDisabled(false);
  updateSplitButton();
}

function render() {
  const card = deck[idx];
  document.getElementById('questionText').innerHTML = card.q.replace(/\n/g, '<br>');
  document.getElementById('actionBadge').textContent = card.action;
  document.getElementById('actionBadge').className = 'action-badge ' + card.cls;
  document.getElementById('answerDetail').innerHTML = card.detail;
  document.getElementById('cardInner').classList.remove('flipped');
  document.getElementById('backFace').className = 'card-face card-back';
  document.getElementById('resultVerdict').textContent = '';
  document.getElementById('yourAnswerLabel').textContent = '';
  answered = false;
  setButtonsDisabled(false);
  document.getElementById('tapHint').style.display = 'none';

  const pct = ((idx + 1) / deck.length) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('counter').textContent = `Card ${idx + 1} of ${deck.length}`;
}

function updateSplitButton() {
  const card = deck[idx];
  // Show split button only for pairs category cards that need it
  let splitBtn = document.getElementById('splitBtn');
  const needsSplit = card && card.action === 'SPLIT';
  // Always show all 4 buttons; split is always visible but dim if not relevant
  // (users should learn WHEN to split vs not)
}

function answer(chosen) {
  if (answered) return;
  answered = true;
  const card = deck[idx];
  const correct = chosen === card.action;

  if (correct) {
    correctCount++;
  } else {
    wrongCount++;
  }
  updateScore();

  // Flash the pressed button
  const btns = document.querySelectorAll('.action-btn');
  btns.forEach(b => {
    if (b.textContent.trim().toUpperCase() === chosen) {
      b.classList.add(correct ? 'flash-correct' : 'flash-wrong');
      setTimeout(() => b.classList.remove('flash-correct', 'flash-wrong'), 500);
    }
  });

  // Show result on card back
  const verdict = document.getElementById('resultVerdict');
  verdict.textContent = correct ? '✓ Correct' : '✗ Wrong';
  verdict.className = 'result-verdict ' + (correct ? 'correct' : 'wrong');

  if (!correct) {
    document.getElementById('yourAnswerLabel').textContent = `You chose: ${chosen}  ·  Correct: ${card.action}`;
  }

  document.getElementById('backFace').className = 'card-face card-back ' + (correct ? 'result-correct' : 'result-wrong');
  document.getElementById('cardInner').classList.add('flipped');
  setButtonsDisabled(true);
  document.getElementById('tapHint').style.display = 'block';
  document.getElementById('cardScene').style.cursor = 'pointer';
}

function cardTapped() {
  if (answered) nextCard();
}

function nextCard() {
  if (idx + 1 >= deck.length) {
    showEnd();
  } else {
    idx++;
    render();
  }
}

function setButtonsDisabled(disabled) {
  document.querySelectorAll('.action-btn').forEach(b => b.disabled = disabled);
}

function updateScore() {
  document.getElementById('scoreCorrect').textContent = correctCount;
  document.getElementById('scoreWrong').textContent = wrongCount;
}

function showEnd() {
  document.getElementById('cardScene').style.display = 'none';
  document.getElementById('actionButtons').style.display = 'none';
  const total = correctCount + wrongCount;
  const pct = Math.round((correctCount / total) * 100);
  document.getElementById('finalScore').textContent = `${correctCount} / ${total}  (${pct}%)`;
  document.getElementById('endScreen').classList.add('visible');
}

// Build tabs
const tabsEl = document.getElementById('tabs');
CATEGORIES.forEach(cat => {
  const btn = document.createElement('button');
  btn.className = 'tab' + (cat === 'All' ? ' active' : '');
  btn.textContent = cat;
  btn.onclick = () => {
    currentCat = cat;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    shuffle();
  };
  tabsEl.appendChild(btn);
});

// Add Split to action buttons grid
const grid = document.getElementById('actionButtons');
const splitBtn = document.createElement('button');
splitBtn.className = 'action-btn split';
splitBtn.textContent = 'Split';
splitBtn.style.cssText = 'background:#7a2a1a;color:#ffd8d0;';
splitBtn.onclick = () => answer('SPLIT');
grid.appendChild(splitBtn);

// Adjust grid for 5 buttons: 2+2+1
grid.style.gridTemplateColumns = '1fr 1fr';

shuffle();
</script>

  #actionButtons { grid-template-columns: 1fr 1fr; }

  #tapHint { font-family: 'Gill Sans Nova','Gill Sans',Optima,sans-serif !important; color: rgba(232,228,216,0.2) !important; letter-spacing: 3px !important; }
